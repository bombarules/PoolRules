<script>
// Puddle Jumper: chemical / pump room (A) and water heater room (B), built from the walk-through video.
// Units: metres. x = east, z = south, y = up. Origin = north-west floor corner of room A.
function buildScene(T,scene,R,F){
 const V=(x,y,z)=>new T.Vector3(x,y,z),PI=Math.PI,H=2.7;
 const M=(c,o)=>new T.MeshStandardMaterial(Object.assign({color:c,roughness:.72,metalness:.05},o||{}));
 const put=(m,x,y,z,reg)=>{m.position.set(x,y,z);scene.add(m);if(reg)R(m,reg);return m};
 const box=(w,h,d,c,x,y,z,reg,o)=>put(new T.Mesh(new T.BoxGeometry(w,h,d),M(c,o)),x,y,z,reg);
 const cyl=(r,h,c,x,y,z,reg,o,rt)=>put(new T.Mesh(new T.CylinderGeometry(rt===undefined?r:rt,r,h,20),M(c,o)),x,y,z,reg);
 const cylx=(r,h,c,x,y,z,reg,o,rt)=>{const m=cyl(r,h,c,x,y,z,reg,o,rt);m.rotation.z=PI/2;return m};   // axis along x
 const cylz=(r,h,c,x,y,z,reg,o,rt)=>{const m=cyl(r,h,c,x,y,z,reg,o,rt);m.rotation.x=PI/2;return m};   // axis along z
 const sph=(r,c,x,y,z,reg,o)=>put(new T.Mesh(new T.SphereGeometry(r,14,10),M(c,o)),x,y,z,reg);
 const tor=(Rr,r,c,x,y,z,rx,reg)=>{const m=put(new T.Mesh(new T.TorusGeometry(Rr,r,8,26),M(c,{roughness:.5})),x,y,z,reg);m.rotation.x=rx||0;return m};
 const pipe=(a,b,r,c,reg,o,flow)=>{const A=V(a[0],a[1],a[2]),B=V(b[0],b[1],b[2]),d=B.clone().sub(A),L=d.length();
  const m=new T.Mesh(new T.CylinderGeometry(r,r,L,14),M(c,o));m.position.copy(A.clone().add(B).multiplyScalar(.5));m.quaternion.setFromUnitVectors(V(0,1,0),d.normalize());scene.add(m);if(reg)R(m,reg);if(flow)F.flow(m,flow,L,a,b);return m};
 const shell=[];
 const plane=(w,h,c,x,y,z,rx,ry,isCeil)=>{const m=new T.Mesh(new T.PlaneGeometry(w,h),M(c,{roughness:.95}));m.position.set(x,y,z);m.rotation.x=rx||0;m.rotation.y=ry||0;scene.add(m);(isCeil?ceil:shell).push(m);return m};
 const ceil=[];
 // ===== shared detail kit: flanges with bolts, butterfly valves, finned motors, pump casings, filter details, gauges, unions =====
 const MET=(c,o)=>M(c,Object.assign({roughness:.42,metalness:.55},o||{}));
 const putm=(m,x,y,z)=>{m.position.set(x,y,z);scene.add(m);return m};
 const cmesh=(r,h,c,x,y,z,ax,rt,seg,metal)=>{const m=new T.Mesh(new T.CylinderGeometry(rt===undefined?r:rt,r,h,seg||18),metal?MET(c):M(c));if(ax==='x')m.rotation.z=PI/2;else if(ax==='z')m.rotation.x=PI/2;return putm(m,x,y,z)};
 const bmesh=(w,h,d,c,x,y,z,metal)=>putm(new T.Mesh(new T.BoxGeometry(w,h,d),metal?MET(c):M(c)),x,y,z);
 // ring of bolt heads around an axis (axis = pipe direction)
 const boltRing=(x,y,z,R,n,ax,c,len)=>{for(let k=0;k<n;k++){const a=k*PI*2/n,ca=Math.cos(a)*R,sa=Math.sin(a)*R;
   const px=ax==='x'?x:x+ca,py=ax==='y'?y:(ax==='x'?y+ca:y+ca),pz=ax==='z'?z:(ax==='x'?z+sa:z+sa);
   const q=ax==='y'?[x+ca,y,z+sa]:ax==='x'?[x,y+ca,z+sa]:[x+ca,y+sa,z];
   cmesh(.016,len||.04,c||0x8a9096,q[0],q[1],q[2],ax,undefined,6,true)}};
 // flange: disc with bolts and a thin gasket
 const flange=(x,y,z,rp,ax,nb,c)=>{cmesh(rp*1.85,.04,c||0x4f565d,x,y,z,ax,undefined,24,true);boltRing(x,y,z,rp*1.5,nb||8,ax,0xa0a6ac,.05);cmesh(rp*1.12,.05,0x1c1f22,x,y,z,ax,undefined,16)};
 // butterfly valve with flanges, neck, top plate, lever and notch plate
 const bfValve=(x,y,z,rp,ax,leverDir,reg)=>{
   const L=.13,fx=ax==='x'?[L/2,0,0]:ax==='z'?[0,0,L/2]:[0,L/2,0];
   const body=cmesh(rp*1.3,L,0x3c434a,x,y,z,ax,undefined,20,true);if(reg)R(body,reg);
   for(const s of [-1,1])flange(x+fx[0]*s*1.0,y+fx[1]*s*1.0,z+fx[2]*s*1.0,rp,ax,8);
   cmesh(rp*.55,.17,0x2e343a,x,y+rp*1.3+.07,z,'y',undefined,12,true);                  // neck
   bmesh(rp*1.5,.03,rp*1.8,0x20252a,x,y+rp*1.3+.16,z,true);                             // top plate
   const dx=ax==='x'?0:1,dz=ax==='x'?1:0;const ld=leverDir||1;
   bmesh(ax==='x'?.04:.46,.035,ax==='x'?.46:.04,0xd0402d,x+(ax==='x'?0:ld*.2),y+rp*1.3+.2,z+(ax==='x'?ld*.2:0));     // red lever
   cmesh(.03,.09,0x1a1a1d,x+(ax==='x'?0:ld*.42),y+rp*1.3+.2,z+(ax==='x'?ld*.42:0),'y');                                // grip
   bmesh(ax==='x'?.05:.12,.012,ax==='x'?.12:.05,0xb8bec4,x+(ax==='x'?0:ld*.3),y+rp*1.3+.18,z+(ax==='x'?ld*.3:0),true)};  // notch plate
 // pressure gauge on a short stem
 const gauge=(x,y,z,face)=>{const dx=face==='x'?1:0,dz=face==='z'?1:0;
   cmesh(.02,.1,0x8c9298,x,y-.06,z,'y',undefined,8,true);
   const g=cmesh(.075,.04,0x14181c,x,y+.02,z,face==='x'?'x':'z',undefined,20,true);
   cmesh(.065,.012,0xf4f4f0,x+dx*.022,y+.02,z+dz*.022,face==='x'?'x':'z',undefined,20);
   bmesh(dx?.008:.05,.008,dz?.008:.05,0xcc2222,x+dx*.03,y+.03,z+dz*.03)};
 // union / coupling collar on a pipe
 const collar=(x,y,z,rp,ax,w)=>{cmesh(rp*1.22,w||.07,0xe6e3d3,x,y,z,ax,undefined,16);cmesh(rp*1.3,.018,0xcfcbb8,x+(ax==='x'?(w||.07)/2:0),y+(ax==='y'?(w||.07)/2:0),z+(ax==='z'?(w||.07)/2:0),ax,undefined,16)};
 // pipe clamp with ears
 const clamp=(x,y,z,rp,ax,c)=>{cmesh(rp*1.12,.05,c||0x9aa2a8,x,y,z,ax,undefined,16,true);bmesh(.06,.05,.04,c||0x9aa2a8,x+(ax==='y'?rp*1.2:0),y+(ax==='y'?0:rp*1.2),z,true)};
 // finned electric motor: frame, cooling fins, end bells, fan cover with grille, terminal box, nameplate, feet

 // ---- exploded layout: every part scaled to a similar size, drawn as a light outlined technical sketch, in install order
 const outline=g=>{const ms=[];g.traverse(o=>{if(o.isMesh)ms.push(o)});ms.forEach(o=>{if(o.material&&o.material.color&&T.Color){o.material.color.lerp(new T.Color(0xffffff),.22);o.material.metalness=.1;o.material.roughness=.7}
   if(o.geometry&&T.MeshBasicMaterial&&T.BackSide!==undefined){const h=new T.Mesh(o.geometry,new T.MeshBasicMaterial({color:0x10151f,side:T.BackSide}));h.scale.set(1.09,1.09,1.09);o.add(h)}
   if(T.EdgesGeometry&&T.LineSegments&&T.LineBasicMaterial&&o.geometry){const e=new T.LineSegments(new T.EdgesGeometry(o.geometry,28),new T.LineBasicMaterial({color:0x10151f}));o.add(e)}})};
 function exploded(cat){return explodedC(typeof cat==='string'?CAT[cat]:cat)}
 function explodedC(c){const root=G(),list=[],rows=[[]],MAXW=7.6,gap=.42;let x=0,r=0;
  c.parts.forEach((p,i)=>{const b=K[p.k]();b.g.traverse(o=>{if(o.isMesh){o.userData.part=i}});outline(b.g);
   let w=b.w,sc=1;const piv=G();
   if(T.Box3){const bb=new T.Box3().setFromObject(b.g),sz=bb.getSize(new T.Vector3()),ct=bb.getCenter(new T.Vector3()),m=Math.max(sz.x,sz.y,sz.z,.05);sc=Math.max(.5,Math.min(3,1.45/m));w=Math.max(.5,sz.x*sc);b.g.position.set(-ct.x,-ct.y,-ct.z)}
   piv.add(b.g);piv.scale.set(sc,sc,sc);
   if(p.side){const row=rows[r];let prev={cx:0};for(let q=row.length-1;q>=0;q--)if(!row[q].side){prev=row[q];break}const sibs=row.filter(t=>t.side&&t.par===prev);row.push({side:true,par:prev,i:i,g:piv,p:p,cx:prev.cx+sibs.length*.62,w:w});return}
   if(x>0&&x+w>MAXW){r++;rows[r]=[];x=0}
   rows[r].push({side:false,i:i,g:piv,p:p,cx:x+w/2,w:w});x+=w+gap});
  let W=0;rows.forEach(row=>{const m=row.filter(t=>!t.side);if(m.length){const e=m[m.length-1];row.width=e.cx+e.w/2}else row.width=1;W=Math.max(W,row.width)});
  const RHS=rows.map(row=>row.some(t=>t.side)?2.55:1.8),H=RHS.reduce((x,y)=>x+y,0);let yt=H/2;
  rows.forEach((row,ri)=>{const oy=yt-RHS[ri]/2,ox=-row.width/2;yt-=RHS[ri];
   row.forEach(t=>{const y=oy+(t.side?-1.1:0);t.g.position.set(t.cx+ox,y,0);root.add(t.g);list.push({x:t.cx+ox,y:y,i:t.i,g:t.g,p:t.p})});
   const line=new T.Mesh(new T.CylinderGeometry(.012,.012,row.width+.3,6),mt(0x8a96a8,{metalness:0}));line.rotation.z=PI/2;line.position.set(0,oy,-.05);root.add(line)});
  return{root:root,list:list,w:W+.8,h:H+.2}}
 // ---- X-ray: assembled cutaway with moving parts and flow particles
 function xray(cat){return xrayT(typeof cat==='string'?CAT[cat].xray:cat)}
 function xrayT(type){const root=G(),spin=[],flow=[];const gl=(c,o)=>mt(c,Object.assign({transparent:true,opacity:.42,metalness:.1,roughness:.2,depthWrite:false,emissive:0x1b3a66},o||{}));
  if(type==='pump'){const sh=add(root,new T.Mesh(new T.CylinderGeometry(.62,.62,.6,26),gl(0x7e8fa3)),0,0,0);sh.rotation.z=PI/2;const so=add(root,new T.Mesh(new T.CylinderGeometry(.3,.3,.6,20),gl(0x7e8fa3)),-.7,0,0);so.rotation.z=PI/2;add(root,new T.Mesh(new T.CylinderGeometry(.2,.2,.8,20),gl(0x7e8fa3)),0,.8,0);
   const imp=G();cx(imp,.46,.1,0xc9a35a,0,0,0);for(let k=0;k<6;k++){const a=k*PI/3,m=bx(imp,.2,.05,.34,0xb5903f,.05,Math.sin(a)*.24,Math.cos(a)*.24);m.rotation.x=-a}root.add(imp);spin.push(imp);
   const shaft=G();cx(shaft,.07,1.8,0xd0d5d9,.7,0,0);root.add(shaft);spin.push(shaft);cx(root,.4,.9,0xd9b24a,1.7,0,0);
   const path=[[-1.25,0,0],[-.7,0,0],[-.3,0,0],[0,.35,0],[0,.8,0],[0,1.25,0]];for(let k=0;k<18;k++)flow.push({m:add(root,new T.Mesh(new T.SphereGeometry(.05,8,6),mt(0x3fa0f0,{metalness:0,emissive:0x1a5aa0})),0,0,0),path:path,u:k/18,s:.16})}
  else if(type==='motor'){const sh=add(root,new T.Mesh(new T.CylinderGeometry(.5,.5,1.4,26),gl(0xc9a23c)),0,0,0);sh.rotation.z=PI/2;const st=G();cx(st,.4,.7,0x8a5a2a,0,0,0);cx(st,.27,.72,0x2a2a2d,0,0,0);root.add(st);
   const ro=G();cx(ro,.07,1.9,0xc9cdd1,0,0,0);cx(ro,.26,.55,0x6b7078,0,0,0);for(let k=0;k<12;k++)cx(ro,.012,.55,0xb8bdc2,0,Math.sin(k*PI/6)*.24,Math.cos(k*PI/6)*.24);root.add(ro);spin.push(ro);
   cx(root,.5,.12,0xb0892e,-.78,0,0);cx(root,.5,.12,0xb0892e,.78,0,0);sp(root,.13,0xb7bcc2,-.78,0,0);sp(root,.13,0xb7bcc2,.78,0,0);const fn=G();for(let k=0;k<9;k++){const a=k*PI*2/9,m=bx(fn,.05,.05,.3,0x1d1d20,0,Math.sin(a)*.2,Math.cos(a)*.2);m.rotation.x=-a}fn.position.x=1.05;root.add(fn);spin.push(fn)}
  else if(type==='filter'){const sh=add(root,new T.Mesh(new T.CylinderGeometry(.7,.7,1.5,26),gl(0x9fcab0)),0,0,0);add(root,new T.Mesh(new T.SphereGeometry(.7,22,12,0,PI*2,0,PI/2),gl(0x9fcab0)),0,.75,0);
   add(root,new T.Mesh(new T.CylinderGeometry(.66,.66,.45,24),mt(0xd6c28a,{roughness:.9,metalness:0,transparent:true,opacity:.8})),0,-.35,0);add(root,new T.Mesh(new T.CylinderGeometry(.66,.66,.22,24),mt(0x9b9285,{roughness:.95,metalness:0})),0,-.68,0);
   for(let k=-2;k<=2;k++)cy(root,.03,.2,0xe8e4cc,k*.2,-.5,0);const path=[[0,1.05,0],[0,.5,0],[0,0,0],[0,-.5,0],[.0,-.78,0],[.9,-.78,0]];for(let k=0;k<20;k++)flow.push({m:add(root,new T.Mesh(new T.SphereGeometry(.05,8,6),mt(0x3fa0f0,{metalness:0,emissive:0x1a5aa0})),0,0,0),path:path,u:k/20,s:.2,jx:(k%5-2)*.12,jz:(k%3-1)*.15})}
  else if(type==='wheater'){const sh=add(root,new T.Mesh(new T.CylinderGeometry(.6,.6,1.8,26),gl(0xb8c4d0)),0,0,0);add(root,new T.Mesh(new T.CylinderGeometry(.55,.55,1.2,24),mt(0x3f9ee8,{transparent:true,opacity:.35,metalness:0,depthWrite:false})),0,-.2,0);
   cy(root,.03,1.6,0x5b8fd0,.25,.05,0);cy(root,.04,1.5,0xa9afb5,-.25,.1,0);const fl=G();for(let k=0;k<4;k++){const c=add(fl,new T.Mesh(new T.ConeGeometry(.07,.3,8),mt(0xff8a20,{emissive:0xff5a00,metalness:0})),-.3+k*.2,-.95,0)}root.add(fl);spin.push({flick:fl});
   const path=[[.25,.85,0],[.25,.2,0],[.25,-.6,0],[-.25,-.5,0],[-.25,.2,0],[-.25,.9,0]];for(let k=0;k<16;k++)flow.push({m:add(root,new T.Mesh(new T.SphereGeometry(.05,8,6),mt(0x3fa0f0,{metalness:0,emissive:0x1a5aa0})),0,0,0),path:path,u:k/16,s:.15})}
  if(T.EdgesGeometry&&T.LineSegments&&T.LineBasicMaterial){const sh=[];root.traverse(o=>{if(o.isMesh&&o.material&&o.material.transparent&&o.material.opacity<.6)sh.push(o)});sh.forEach(o=>{const e=new T.LineSegments(new T.EdgesGeometry(o.geometry,25),new T.LineBasicMaterial({color:0x9cc4ff}));o.add(e)})}
  flow.forEach(f=>{f.m.scale.set(1.5,1.5,1.5)});
  return{root:root,spin:spin,flow:flow}}
 return{CAT:CAT,exploded:exploded,xray:xray,K:K,kindFor:kindFor}
}
