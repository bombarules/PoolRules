// RUNWAY 35 HEATER ROOM (indoor): controls wall, electrical panels, unit heater, water heater and black iron circulation manifold.
// Units: metres. x = east, z = south, y = up. Origin = north-west floor corner.
function buildScene(T,scene,R,F){
 const V=(x,y,z)=>new T.Vector3(x,y,z),PI=Math.PI;
 const M=(c,o)=>new T.MeshStandardMaterial(Object.assign({color:c,roughness:.72,metalness:.05},o||{}));
 const put=(m,x,y,z,reg)=>{m.position.set(x,y,z);scene.add(m);if(reg)R(m,reg);return m};
 const box=(w,h,d,c,x,y,z,reg,o)=>put(new T.Mesh(new T.BoxGeometry(w,h,d),M(c,o)),x,y,z,reg);
 const cyl=(r,h,c,x,y,z,reg,o,rt)=>put(new T.Mesh(new T.CylinderGeometry(rt===undefined?r:rt,r,h,20),M(c,o)),x,y,z,reg);
 const cylx=(r,h,c,x,y,z,reg,o,rt)=>{const m=cyl(r,h,c,x,y,z,reg,o,rt);m.rotation.z=PI/2;return m};
 const cylz=(r,h,c,x,y,z,reg,o,rt)=>{const m=cyl(r,h,c,x,y,z,reg,o,rt);m.rotation.x=PI/2;return m};
 const sph=(r,c,x,y,z,reg,o)=>put(new T.Mesh(new T.SphereGeometry(r,14,10),M(c,o)),x,y,z,reg);
 const pipe=(a,b,r,c,reg,flow)=>{const A=V(a[0],a[1],a[2]),B=V(b[0],b[1],b[2]),d=B.clone().sub(A),L=d.length();
  const m=new T.Mesh(new T.CylinderGeometry(r,r,L,14),M(c));m.position.copy(A.clone().add(B).multiplyScalar(.5));m.quaternion.setFromUnitVectors(V(0,1,0),d.normalize());scene.add(m);if(reg)R(m,reg);if(flow)F.flow(m,flow,L,a,b);return m};
 const plane=(w,h,c,x,y,z,rx,ry,o)=>{const m=new T.Mesh(new T.PlaneGeometry(w,h),M(c,Object.assign({roughness:.95},o||{})));m.position.set(x,y,z);m.rotation.x=rx||0;m.rotation.y=ry||0;scene.add(m);return m};
 // ===== shared detail kit: flanges with bolts, butterfly valves, finned motors, pump casings, filter details, gauges, unions =====
 const MET=(c,o)=>M(c,Object.assign({roughness:.42,metalness:.55},o||{}));
 const putm=(m,x,y,z)=>{m.position.set(x,y,z);scene.add(m);return m};
 const cmesh=(r,h,c,x,y,z,ax,rt,seg,metal)=>{const m=new T.Mesh(new T.CylinderGeometry(rt===undefined?r:rt,r,h,seg||18),metal?MET(c):M(c));if(ax==='x')m.rotation.z=PI/2;else if(ax==='z')m.rotation.x=PI/2;return putm(m,x,y,z)};
 const bmesh=(w,h,d,c,x,y,z,metal)=>putm(new T.Mesh(new T.BoxGeometry(w,h,d),metal?MET(c):M(c)),x,y,z);
 // ring of bolt heads around an axis (axis = pipe direction)
 const boltRing=(x,y,z,R,n,ax,c,len)=>{for(let k=0;k<n;k++){const a=k*PI*2/n,ca=Math.cos(a)*R,sa=Math.sin(a)*R;
   const px=ax==='x'?x:x+ca,py=ax==='y'?y:(ax==='x'?y+ca:y+ca),pz=ax==='z'?z:(ax==='x'?z+sa:z+sa);
   const q=ax==='y'?[x+ca,y,z+sa]:ax==='x'?[x,y+ca,z+sa]:[x+ca,y+sa,z];
   cmesh(.016,len||.04,c||0x8a9096,q[0],q[1],q[2],ax,undefined,6,true)}};
 // flange: disc with bolts and a thin gasket
 const flange=(x,y,z,rp,ax,nb,c)=>{cmesh(rp*1.85,.04,c||0x4f565d,x,y,z,ax,undefined,24,true);boltRing(x,y,z,rp*1.5,nb||8,ax,0xa0a6ac,.05);cmesh(rp*1.12,.05,0x1c1f22,x,y,z,ax,undefined,16)};
 // butterfly valve with flanges, neck, top plate, lever and notch plate
 const bfValve=(x,y,z,rp,ax,leverDir,reg)=>{
   const L=.13,fx=ax==='x'?[L/2,0,0]:ax==='z'?[0,0,L/2]:[0,L/2,0];
   const body=cmesh(rp*1.3,L,0x3c434a,x,y,z,ax,undefined,20,true);if(reg)R(body,reg);
   for(const s of [-1,1])flange(x+fx[0]*s*1.0,y+fx[1]*s*1.0,z+fx[2]*s*1.0,rp,ax,8);
   cmesh(rp*.55,.17,0x2e343a,x,y+rp*1.3+.07,z,'y',undefined,12,true);                  // neck
   bmesh(rp*1.5,.03,rp*1.8,0x20252a,x,y+rp*1.3+.16,z,true);                             // top plate
   const dx=ax==='x'?0:1,dz=ax==='x'?1:0;const ld=leverDir||1;
   bmesh(ax==='x'?.04:.46,.035,ax==='x'?.46:.04,0xd0402d,x+(ax==='x'?0:ld*.2),y+rp*1.3+.2,z+(ax==='x'?ld*.2:0));     // red lever
   cmesh(.03,.09,0x1a1a1d,x+(ax==='x'?0:ld*.42),y+rp*1.3+.2,z+(ax==='x'?ld*.42:0),'y');                                // grip
   bmesh(ax==='x'?.05:.12,.012,ax==='x'?.12:.05,0xb8bec4,x+(ax==='x'?0:ld*.3),y+rp*1.3+.18,z+(ax==='x'?ld*.3:0),true)};  // notch plate
 // pressure gauge on a short stem
 const gauge=(x,y,z,face)=>{const dx=face==='x'?1:0,dz=face==='z'?1:0;
   cmesh(.02,.1,0x8c9298,x,y-.06,z,'y',undefined,8,true);
   const g=cmesh(.075,.04,0x14181c,x,y+.02,z,face==='x'?'x':'z',undefined,20,true);
   cmesh(.065,.012,0xf4f4f0,x+dx*.022,y+.02,z+dz*.022,face==='x'?'x':'z',undefined,20);
   bmesh(dx?.008:.05,.008,dz?.008:.05,0xcc2222,x+dx*.03,y+.03,z+dz*.03)};
 // union / coupling collar on a pipe
 const collar=(x,y,z,rp,ax,w)=>{cmesh(rp*1.22,w||.07,0xe6e3d3,x,y,z,ax,undefined,16);cmesh(rp*1.3,.018,0xcfcbb8,x+(ax==='x'?(w||.07)/2:0),y+(ax==='y'?(w||.07)/2:0),z+(ax==='z'?(w||.07)/2:0),ax,undefined,16)};
 // pipe clamp with ears
 const clamp=(x,y,z,rp,ax,c)=>{cmesh(rp*1.12,.05,c||0x9aa2a8,x,y,z,ax,undefined,16,true);bmesh(.06,.05,.04,c||0x9aa2a8,x+(ax==='y'?rp*1.2:0),y+(ax==='y'?0:rp*1.2),z,true)};
 // finned electric motor: frame, cooling fins, end bells, fan cover with grille, terminal box, nameplate, feet
 const motorDetail=(x,y,z,r,len,ax,col,reg)=>{
   const main=cmesh(r,len,col,x,y,z,ax,undefined,24,true);if(reg)R(main,reg);
